<!doctype html>
<html lang="en">
  <head>
    <script>
      const path = window.location.pathname
      // Check if the path ends with '/number'
      const match = path.match(/^(.*)\/\d+\/?$/)

      if (match) {
        window.location.href = match[1]
      } else {
        window.location.href = "https://jaluwibowo.id/talks"
      }
    </script>
    <title>Redirecting...</title>
  </head>

  <body>
    <p>
      Redirecting... If not redirected, click
      <a href="https://jaluwibowo.id/talks">here</a>.
    </p>
  </body>
</html>
